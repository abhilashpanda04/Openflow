[project]
name = "asr-backend"
version = "0.1.0"
description = "ASR Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "torch>=2.0.1",
    "qwen-asr>=0.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.optional-dependencies]
backend = [
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.3",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "ml-dtypes>=0.5.0",
    "websockets>=12.0",
    "nemo-toolkit[asr]>=1.22.0",
]
